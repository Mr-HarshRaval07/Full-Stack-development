<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        function fun()   //method 1: Function triggered on event
        {
            alert("You clicked")
        }
    </script>
</head>
<body>
    <input type="button" onclick="fun()" value="click me"> <!--method 1-->
</body>
</html>
