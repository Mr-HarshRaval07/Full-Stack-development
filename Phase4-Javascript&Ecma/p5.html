<!-- write a js to validate username and password. Password length must be 6-10 characters. 
Username should not startwith _@ and any number ,also check both field must not be blank.-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="a1">user name
    <input type="password" id="a2">password
    <input type="submit" onclick="fun()">
    <script>
        function fun()
        {
            pat=/^_|^@|^\d/
            u=document.getElementById('a1').value
            v=document.getElementById('a2').value
            if(u.length==0 && v.length==0)
            {
                alert('<<<<<< Blank field >>>>>>')
            }
            else if(v.length<6 || v.length>12)
            {
                alert('Password must be of length 6 to 12 ')
            }
            else
            {
                alert('Perfect password')
            }
            if(pat.test(u))
            {
                alert("Enter valid username.")
            }
        }
    </script>
</body>
</html>
