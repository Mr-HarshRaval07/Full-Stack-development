<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const add1=(j,k)=>{return `${j+k}`}   //or we can write `${j+k}`
        console.log(`Addition = ${add1(5,9)}`)
    </script>
    <script>
        const add2=(j,k)=>{`${j+k}`}   //undefined because we did not use return but also used curly bracket which is generally used for multiple lines.
        console.log(`Addition = ${add2(5,9)}`)
    </script>
</body>
</html>
