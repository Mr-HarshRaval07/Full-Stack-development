<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div onclick="this.innerHTML='Hello'">I am onclick</div>
    <div onmouseover="this.style.color='tomato'">I am mouse over</div>
    <div onmouseout="this.style.backgroundcolor='cyan'">I am mouse out</div>
    <div onmousedown="this.style.color='blue'">I am mouse down</div>
    <div onmouseup="this.style.color='Pink'">I am mouse up</div>
</body>
</html>
