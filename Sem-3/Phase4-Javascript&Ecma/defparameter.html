<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function fun(bg,txt,size='20px',fs='italic')
        {
            i=document.getElementById('a1')
            i.style.color=txt;
            i.style.backgroundColor=bg;
            i.style.fontSize=size;
            i.style.fontStyle=fs;
        }
    </script>
</head>
<body>
    <div id="a1">Hello</div>
        <input type="submit" onclick="fun('tomato','cyan')" value="click me">
</body>
</html>
