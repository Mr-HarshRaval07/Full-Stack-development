<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        button:hover{background-color: blue;}
        button:active{background-color: green;}
        input:focus{background-color: green;}
        ul li:nth-child(2){background-color: lawngreen;font-weight: bold;}
        ul li:not(.special){color: royalblue;font-style: italic;}
        div:hover{background-color: tomato;}
        .a{background-color: cyan;height: 300px;width: 300px;}
    </style>
</head>
<body>
    <button value="click me!">Click me!</button>
    <input type="text">
    <ul>
        <li>first item</li>
        <li>second item(special)</li>
        <li class="special">special list item</li>
        <li>another normal item</li>
    </ul>
    <div class="a"></div>
</body>
</html>
