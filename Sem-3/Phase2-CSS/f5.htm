<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        div{height: 300px;width: 300px;background-color: pink;margin: 10px;float: left;}
        .a:hover{background-image: linear-gradient(to top, red,yellow,blue);}
        .b:hover{background-image: linear-gradient(to top left, red,yellow,blue);}
        .c:hover{background-image: linear-gradient(45deg, red,yellow,blue);}
        .d:hover{background-image: linear-gradient(red 20%,yellow 30%,blue 50%);}
    </style>
</head>
<body>
    <div class="a"></div>
    <div class="b"></div>
    <div class="c"></div>
    <div class="d"></div>
</body>
</html>
