<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        @keyframes f2 
        {
            0% {background-color: tomato;top: 0px;left: 0px;transform: rotate(0deg);}
            50% {background-color: green;top: 125px;left: 125px; border-radius: 50%;transform: (3600deg)}
            100% {background-color: yellow;top: 0px;left: 250px;transform: rotate(7200deg)}
        }
        div{height: 100px;width: 100px;position: relative;background-color: cyan;
            animation: f2 2s ease 1s infinite alternate;transition: transform 10s ease 0s;}
    </style>
</head>
<body>
    <div></div>
</body>
</html>
