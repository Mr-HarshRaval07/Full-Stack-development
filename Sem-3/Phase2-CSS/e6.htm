<html>
    <head></head>

<style>
  body {
    background-color: rgb(176,190,197);
    font-family: Arial, sans-serif;
    padding: 20px;
    text-align: center;
  }

  form {
    display: block;
    margin: 30px auto;
    width: 100%;
    max-width: 400px;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 0 10px black;
    background-color: #fff;
    box-sizing: border-box;
  }

  /* Input field styling */
  .i1 {
    width: 90%;
    max-width: 100%;
    height: 40px;
    border: 2px solid gray;
    padding: 10px;
    margin-bottom: 20px;
    transition: all 0.5s ease;
    box-sizing: border-box;
    border-radius: 5px;
    font-size: 16px;
  }

  /* Input hover effect */
  .i1:hover {
    background-color: aqua;
    color: blue;
    border: 5px dotted blue;
  }

  /* Button styling */
  .b1 {
    width: 90%;
    max-width: 100%;
    background-color: black;
    color: white;
    font-size: 18px;
    padding: 15px;
    border: 3px solid red;
    border-radius: 10px;
    margin: 15px 0;
    transition: all 0.4s ease;
    cursor: pointer;
  }

  /* Button hover effect */
  .b1:hover {
    background-color: white;
    color: black;
    padding: 18px;
    border: 5px solid black;
  }

  /* Responsive adjustments */
  @media (max-width: 480px) {
    form {
      padding: 20px;
    }

    .i1, .b1 {
      font-size: 16px;
      padding: 12px;
    }

    .b1:hover {
      padding: 15px;
    }
  }
</style>
</head>
<body>

<form>
  <input type="text" class="i1" placeholder="Enter Name"><br>
  <input type="submit" class="b1" value="Click Me">
</form>



</body>
</html>
