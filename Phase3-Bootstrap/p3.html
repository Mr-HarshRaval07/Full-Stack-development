<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>
<body>
    <button class="btn btn-danger" data-bs-toggle="offcanvas" data-bs-target="#offcanvasExample">
        Button
    </button>
    <div class="offcanvas offcanvas-start" id="offcanvasExample">
        <div class="offcanvas-header">
            <h1 class="offcanvas-title">Offcanvas</h1>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
            <div>Lorem ipsum dolor sit amet consectetur adipisicing elit. Suscipit neque maxime ipsa nostrum incidunt facere quia quos delectus commodi ipsam. Inventore molestiae sequi quae laboriosam suscipit fugiat debitis ipsa sit.</div>
            <img src="image.jpg" class="w-100 h-auto">
            <button type="button" class="btn btn-danger" data-bs-dismiss="offcanvas">Close</button>
        </div>
    </div>
</body>
</html>
