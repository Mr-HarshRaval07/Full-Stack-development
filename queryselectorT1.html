<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="a">Hello Stranger</p>
    <script>
        function fun1()
        {
            let x1=document.getElementById('a').style.textTransform='uppercase'
        }
        function fun2()
        {
            let x2=document.querySelector('#a').style.textTransform='lowercase'
        }
        </script>
        <input type="button" onclick="fun1()" value="uppercase">
        <input type="button" onclick="fun2()" value="lowercase">

</body>
</html>
