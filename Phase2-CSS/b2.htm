<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        .bm{
            background-color:purple;width:300px;height: 150px;
            border: 4px solid cyan;padding: 10px;
            margin: 60px;box-shadow: 5px 5px 5px tomato;
            box-sizing: border-box;}
        .bm2{
            background-color:purple;width:300px;height: 150px;
            border: 4px solid cyan;padding: 15px 10px 20px 40px;
            margin: 10px 100px;box-shadow: 5px 5px 5px tomato;
            box-sizing: content-box;}
    </style>
</head>
<body>
    <div class="bm">I am a content box</div>
    <div class="bm2">I am a border box</div>
</body>
</html>
