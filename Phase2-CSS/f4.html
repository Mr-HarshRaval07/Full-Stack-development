<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        @keyframes 
        f3{from{top: 100px;left: -100%;}
            to{top: 100px;left: 100%;}}
        div{color: red;height: 100px;width: 100px;position: relative;animation: f3 10s ease-in-out -2s infinite alternate}
    </style>
</head>
<body>
    <div>Special offer!! Limited time only!!!</div>
</body>
</html>
