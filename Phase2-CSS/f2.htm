<!DOCTYPE html>
<html lang="en">
<head>
    <style>@keyframes a1{0% {background-color: tomato;top: 0px;left: 0px;}
                    25% {background-color: cyan;top: 0px;left: 500px;}
                    50% {background-color: green;top: 500px;left: 500px;}
                    75% {background-color: red;top: 500px;left: 0px;}
                    100% {background-color: yellow;top: 0px;left: 0px;}
                }
    div{height: 100px;width: 100px;position: relative;background-color: cyan;
            animation: a1 2s ease 1s infinite alternate;}
    </style>
</head>
<body>
     <div></div>
</body>
</html>
