<html><head><base target="_blank">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    div {
      width: 100px;
      height: 100px;
      background-color: lightblue;
      transition: background-color 2s,
                  height 2s 2s,
                  width 2s 4s,
                  border-radius 2s 6s;
    }

   div:hover {
      background-color: blue;
      height: 200px;
      width: 200px;
      border-radius: 50%;
    }
  </style>
  <title>CSS Transition Program</title>
</head>
<body>
  <div></div>


</body></html>
